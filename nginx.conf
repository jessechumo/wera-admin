server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The admin app answers private networks only (the home LAN, this host,
    # Docker's bridge). It is never meant to sit behind the public tunnel;
    # the API still checks every request for an admin's session.
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Hashed assets are immutable: cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Look the API up through Docker's DNS on each request (cached 10s), so
    # recreating the API container does not leave /api answering 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://wera-api:8080;

    location /api/ {
        proxy_pass $api;
        # $http_host keeps the port, so it matches the browser's Origin
        # (the API refuses state-changing requests from other origins).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /healthz {
        proxy_pass $api;
    }

    # SPA fallback: every other path renders the app.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
